# Este archivo añade las tareas programadas: la copia de seguridad diaria y
# el informe semanal de instalaciones (viernes). No toca la configuración de
# build/publish (esa sigue gestionada desde el panel de Netlify, como hasta ahora).

[functions."backup-diario"]
  schedule = "@daily"

[functions."informe-semanal-instalaciones"]
  # Todos los viernes a las 16:00 UTC (18:00 hora española en verano, 17:00 en invierno).
  schedule = "0 16 * * 5"

[functions."avisos-leads-vencidos"]
  # Todos los días a las 07:00 UTC (9:00 hora española en verano, 8:00 en invierno).
  schedule = "0 7 * * *"

[functions."avisos-material-proceso-externo"]
  # Todos los días a las 07:00 UTC, igual que el aviso de leads.
  schedule = "0 7 * * *"

[functions."avisos-stock-minimo"]
  # Todos los días a las 07:00 UTC, igual que los demás avisos.
  schedule = "0 7 * * *"

[functions."aviso-fabrica-diario"]
  # De lunes a viernes a las 7:00 de la mañana (hora de España), al entrar a trabajar
  # (horario de 7 a 15): lo que hay que preparar para el siguiente día de trabajo
  # (el viernes, para el lunes). Se lanza a las 5 y a las 6 UTC y la propia función
  # solo envía cuando en España son las 7, así vale en verano y en invierno.
  schedule = "0 5,6 * * 1-5"
